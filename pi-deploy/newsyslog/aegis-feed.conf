# AEGIS unified log feed rotation (macOS newsyslog).
#
# Replace <USER> with the account that owns the feed before installing to
# /etc/newsyslog.d/. The path must match AEGIS_FEED_PATH on the same host.
#
# Path                                      Owner:Group   Mode Count Size(KB) When Flags
/Users/<USER>/web-logs/aegis-feed.jsonl     <USER>:staff  644  24    51200    *    JG
