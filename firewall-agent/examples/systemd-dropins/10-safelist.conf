# /etc/systemd/system/aegis-firewall.service.d/10-safelist.conf
#
# IPs and CIDRs the agent must never block. These are the published egress
# ranges of search engines and social-media link previewers: blocking one of
# them makes a site vanish from search results, so they are listed explicitly
# rather than discovered. The agent folds in RFC1918/CGNAT on its own.
#
# Order below: Googlebot, Google crawl pools, Bingbot, Twitterbot, Facebook,
# Apple. Re-check them when a vendor publishes a new range.
[Service]
Environment=AEGIS_SAFE_IPS=66.249.64.0/19,66.102.0.0/20,64.233.160.0/19,216.239.32.0/19,34.64.0.0/10,35.190.0.0/17,40.77.0.0/16,157.55.0.0/16,207.46.0.0/16,13.66.0.0/17,199.16.156.0/22,192.133.76.0/22,31.13.24.0/21,31.13.64.0/18,66.220.144.0/20,69.63.176.0/20,173.252.64.0/18,17.0.0.0/8,20.15.240.64/28,20.15.240.80/28,20.15.240.96/28,52.230.152.0/24,4.227.36.0/25,160.79.104.0/23,74.244.193.0/24
