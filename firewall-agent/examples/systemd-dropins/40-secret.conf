# /etc/systemd/system/aegis-firewall.service.d/40-secret.conf
#
# The shared secret the agent requires on POST /block (X-AEGIS-FW-Auth) lives
# in a root-only file, never in a unit: unit files are world-readable through
# `systemctl cat`. Create it with:
#   sudo install -m 600 -o root -g root /dev/stdin /etc/aegis/firewall.env <<'ENV'
#   AEGIS_FIREWALL_SECRET=<same value AEGIS sends>
#   ENV
# The leading "-" makes the unit start even if the file is absent (the agent
# then runs unauthenticated, which is only acceptable on a trusted LAN).
[Service]
EnvironmentFile=-/etc/aegis/firewall.env
