# /etc/systemd/system/aegis-firewall.service.d/20-netshield.conf
#
# Kernel-level SYN-flood and per-source connection limits (dos_netshield.py).
# The rates are deliberately generous: a shared office NAT or a CDN edge opens
# many connections legitimately, and a false positive here drops real users at
# the gateway, where nothing downstream can override it.
[Service]
Environment=AEGIS_DOS_NETSHIELD=1
Environment=AEGIS_DOS_NETSHIELD_SYN_RATE=60
Environment=AEGIS_DOS_NETSHIELD_CONNLIMIT=150
