# /etc/systemd/system/aegis-firewall.service.d/30-local.conf
#
# Site-specific values. Replace the placeholders; do NOT commit real addresses.
#
# AEGIS_CRAWLER_NETS: individual crawler IPs (comma-separated, no CIDR) that
#   get the behavioural exemption in _verify_crawler. Bing publishes its list
#   as JSON at https://www.bing.com/toolbox/bingbot.json and it changes, so
#   generate this rather than hand-maintaining it:
#     curl -s https://www.bing.com/toolbox/bingbot.json \
#       | python3 -c 'import json,sys;print(",".join(p["ipv4Prefix"].split("/")[0] for p in json.load(sys.stdin)["prefixes"]))'
#   Published CIDR ranges belong in AEGIS_SAFE_IPS instead (see 10-safelist.conf).
#
# AEGIS_CRAWLER_AUTO_UNBLOCK=1 releases a verified crawler that was blocked
#   before its reverse DNS could be confirmed.
#
# AEGIS_ATTACKER_IPS: lab machines whose traffic MUST still raise incidents even
#   though they sit in a private/CGNAT range that the safe-IP gate would skip.
#   This is the pentest box, not a real attacker.
[Service]
Environment=AEGIS_CRAWLER_NETS=203.0.113.10,203.0.113.11
Environment=AEGIS_CRAWLER_AUTO_UNBLOCK=1
Environment=AEGIS_ATTACKER_IPS=198.51.100.20
