name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Public-repo guard (server side, cannot be skipped from a laptop)
  #
  # This repository is public. The pre-commit hook is local config
  # (core.hooksPath is never cloned) and `git commit --no-verify` skips it, so
  # on its own it cannot stop a leak. This job re-runs the same checks against
  # the tracked tree on the runner. It reads only the checked-out commit (no
  # history scan), so it finishes in a couple of seconds. It fails when any of
  # these is tracked:
  #   - an agent/assistant file: CLAUDE.md, AGENTS.md, MEMORY.md, GEMINI.md
  #     (any depth, any letter case), anything under a .claude/ directory, or
  #     .claude.json
  #   - a real env file: .env or .env.* (only *.example templates are allowed)
  #   - an infrastructure identifier SHAPE: a home path (/Users/<name>/,
  #     /home/<name>/), a Tailscale-range host address (100.64.0.0/10), or a
  #     non-default 192.168.x.y LAN address
  # The shapes and the allow-list of documentation values live in
  # scripts/git-hooks/pre-commit (one definition for the hook and for CI); the
  # failure output names each offending path and line and says what to remove.
  # This file stays free of real identifiers: specific names live only in each
  # maintainer's untracked ~/.aegis-private-patterns.
  # ------------------------------------------------------------------
  public-repo-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Refuse private files and infrastructure identifiers
        run: bash scripts/git-hooks/pre-commit --tracked

  # ------------------------------------------------------------------
  # Lint backend (ruff)
  # ------------------------------------------------------------------
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: |
          cd backend
          ruff check app/ --select E,F,W --ignore E501 --exit-zero

  # ------------------------------------------------------------------
  # Backend unit tests (pytest)
  # ------------------------------------------------------------------
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          cd backend
          # `python -m pytest` (not the bare `pytest` script) so the cwd
          # (backend/) is prepended to sys.path — tests/unit/ has an
          # __init__.py but tests/ itself doesn't, which defeats pytest's
          # own rootdir insertion and makes `app.*` imports fail otherwise.
          python -m pytest tests/unit tests/integration -q

  # ------------------------------------------------------------------
  # Frontend build
  # ------------------------------------------------------------------
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Build
        run: |
          cd frontend
          npm run build

  # ------------------------------------------------------------------
  # Docker compose validation
  # ------------------------------------------------------------------
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify compose config
        # The compose file refuses to render without these two secrets (it has
        # no defaults on purpose). CI only validates the file, so throwaway
        # values are enough; they are never used to start anything.
        env:
          AEGIS_SECRET_KEY: ci-placeholder-not-a-secret
          AEGIS_ADMIN_PASSWORD: ci-placeholder-not-a-secret
          AEGIS_FIREWALL_SECRET: ci-placeholder-not-a-secret
        run: docker compose config --quiet

      - name: Compose must refuse to render without its secrets
        run: |
          if docker compose config --quiet 2>/dev/null; then
            echo "docker-compose.yml rendered without its required secrets" >&2
            exit 1
          fi

      - name: Firewall agent unit tests
        run: |
          python3 -m pip install -q -r firewall-agent/requirements.txt pytest
          cd firewall-agent && python3 -m pytest tests -q

      # The all-in-one stack depends on the firewall agent changing the HOST's
      # firewall from a container. Exercise exactly that, the way
      # docker-compose.yml runs it: host network, NET_ADMIN, listening on the
      # stack network's gateway, reached from a container on that network.
      - name: Firewall agent enforces on the host from Docker
        run: |
          set -eu
          docker build -q -t aegis-firewall-ci ./firewall-agent
          docker network create --subnet 172.30.42.0/24 --gateway 172.30.42.1 aegis-net-ci
          SECRET=$(openssl rand -hex 16)
          docker run -d --name aegis-firewall-ci --network host --cap-add NET_ADMIN --cap-add NET_RAW \
            -e AEGIS_FIREWALL_SECRET="$SECRET" -e AEGIS_FIREWALL_BIND=172.30.42.1 aegis-firewall-ci
          for i in $(seq 1 30); do curl -sf http://172.30.42.1:8765/health >/dev/null && break; sleep 1; done
          docker logs aegis-firewall-ci 2>&1 | grep 'host firewall backend'
          api() { docker run --rm --network aegis-net-ci curlimages/curl:8.11.1 -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(api -X POST http://172.30.42.1:8765/block -H 'Content-Type: application/json' -d '{"ip":"203.0.113.50","force":true}')" = 401
          test "$(api -X POST http://172.30.42.1:8765/block -H "X-AEGIS-FW-Auth: $SECRET" -H 'Content-Type: application/json' -d '{"ip":"203.0.113.50","reason":"ci sql_injection","force":true}')" = 200
          sudo iptables -C INPUT -s 203.0.113.50 -j DROP
          sudo iptables -C FORWARD -s 203.0.113.50 -j DROP
          test "$(api -X POST http://172.30.42.1:8765/block -H "X-AEGIS-FW-Auth: $SECRET" -H 'Content-Type: application/json' -d '{"ip":"172.30.42.9","force":true}')" = 403
          test "$(api -X DELETE http://172.30.42.1:8765/block/203.0.113.50 -H "X-AEGIS-FW-Auth: $SECRET")" = 200
          if sudo iptables -C INPUT -s 203.0.113.50 -j DROP 2>/dev/null; then echo "rule survived unblock" >&2; exit 1; fi
          # Not reachable on the host's other addresses.
          if curl -s -m 3 "http://$(hostname -I | awk '{print $1}'):8765/health" >/dev/null; then echo "agent listens beyond the gateway" >&2; exit 1; fi
          echo "firewall agent: host enforcement OK"

      - name: Firewall agent logs
        if: failure()
        run: docker logs aegis-firewall-ci 2>&1 | tail -50 || true
