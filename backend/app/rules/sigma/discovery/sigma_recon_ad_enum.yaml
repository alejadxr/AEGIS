id: sigma_recon_ad_enum
name: Active Directory Enumeration
kind: sigma
severity: high
enabled: false
tactics:
- Discovery
techniques:
- T1087.002
data_sources:
- network
- auth_log
condition:
  event_type: ldap_query
  count_threshold: 20
  time_window_seconds: 120
  group_by: source_ip
entityMappings:
- type: IP
  field: source_ip
description: |
  DISABLED (unfeedable in this deployment): no AEGIS producer emits `ldap_query`
  events. This rule sits on event type `ldap_query`, so it can never receive an
  event and would only inflate the advertised rule count. To revive it, add a
  domain-controller LDAP audit feed, then set `enabled: true`.

  LDAP queries suggesting Active Directory reconnaissance.
