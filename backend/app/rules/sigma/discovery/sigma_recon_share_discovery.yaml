id: sigma_recon_share_discovery
name: Network Share Discovery
kind: sigma
severity: medium
enabled: false
tactics:
- Discovery
techniques:
- T1135
data_sources:
- network
condition:
  event_type: smb_access
  count_threshold: 10
  time_window_seconds: 120
  group_by: source_ip
  unique_field: destination_ip
entityMappings:
- type: IP
  field: source_ip
description: |
  DISABLED (unfeedable in this deployment): no AEGIS producer emits `smb_access`
  events (no SMB audit telemetry exists). This rule sits on event type
  `smb_access`, so it can never receive an event and would only inflate the
  advertised rule count. To revive it, add SMB audit logs or a network sensor
  publishing `smb_access` events, then set `enabled: true`.

  Enumeration of network shares across multiple hosts.
