id: port_scan
name: Port Scan Detected
kind: sigma
severity: medium
enabled: false
tactics:
- Discovery
techniques:
- T1046
data_sources:
- network
condition:
  event_type: connection
  count_threshold: 20
  time_window_seconds: 60
  group_by: source_ip
  unique_field: target_port
entityMappings:
- type: IP
  field: source_ip
description: |
  DISABLED (unfeedable in this deployment): no AEGIS producer emits `connection`
  events (the only network collector, connection_monitor, publishes
  `network_connection` for IOC-listed peers only and is opt-in; host_monitor's
  network_anomaly needs root for psutil.net_connections on macOS and is
  published on a topic the engine does not subscribe to). This rule sits on
  event type `connection`, so it can never receive an event and would only
  inflate the advertised rule count. To revive it, add a flow/connection
  telemetry source (e.g. pcap, conntrack or Zeek on the Pi gateway) publishing
  `connection` events, plus tolerance in _on_rule_triggered for internal-sourced
  firings, then set `enabled: true`.

  Single IP probing multiple ports.
