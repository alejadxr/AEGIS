id: sigma_persist_scheduled_task
name: Scheduled Task Created
kind: sigma
severity: high
enabled: true
tactics:
- Persistence
techniques:
- T1053.005
data_sources:
- edr
condition:
  event_type: process_creation
  filter:
    cmdline_regex: (?i)\bschtasks(\.exe)?\s+.*/create\b
entityMappings:
- type: IP
  field: source_ip
description: |
  Endpoint rule. Fed by process_start events from an AEGIS agent (node-tauri
  or the Python agent); it matches the command line, not the executable path.

  New scheduled task created via schtasks or Task Scheduler.
