id: sigma_persist_registry_run
name: Registry Run Key Persistence
kind: sigma
severity: high
enabled: true
tactics:
- Persistence
techniques:
- T1547.001
data_sources:
- edr
condition:
  event_type: registry_modification
  filter:
    path_regex: (?i)\\(Run|RunOnce)(\\|$)
entityMappings:
- type: IP
  field: source_ip
description: |
  Endpoint rule. Fed by registry_set events (node-tauri ETW sensor, a non-default build feature) and by the node Run/RunOnce key watcher via
  /nodes/events (Windows). The path is the registry key. Only a Run or RunOnce
  key component matches, not any key with "Run" in a name.

  Modification of Windows registry Run key for persistence.
