id: web_shell_activity
name: Repeated POSTs to Script Paths (Possible Web Shell Attempt)
kind: sigma
severity: critical
enabled: true
tactics:
- Persistence
techniques:
- T1505.003
data_sources:
- pm2
- web_log
condition:
  event_type: http_request
  count_threshold: 3
  time_window_seconds: 120
  group_by: source_ip
  filter:
    method: POST
    path_contains:
    - .php
    - .asp
    - .jsp
entityMappings:
- type: IP
  field: source_ip
description: Three or more POST requests to .php/.asp/.jsp paths from one source within two minutes. This is a request-shape signature only, no response status or file evidence is checked, so it is an attempt pattern, not confirmed web shell activity.
