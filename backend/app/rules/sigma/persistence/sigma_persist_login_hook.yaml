id: sigma_persist_login_hook
name: macOS Login Hook Persistence
kind: sigma
severity: high
enabled: true
tactics:
- Persistence
techniques:
- T1037.002
data_sources:
- edr
condition:
  event_type: process_creation
  filter:
    cmdline_regex: (?i)\bdefaults\s+write\s+\S*loginwindow\s+(login|logout)hook\b
entityMappings:
- type: IP
  field: source_ip
description: |
  Endpoint rule. Fed by process_start events from an AEGIS agent (node-tauri
  or the Python agent); it matches the command line, not the executable path.

  Login or logout hook configured for persistence on macOS.
