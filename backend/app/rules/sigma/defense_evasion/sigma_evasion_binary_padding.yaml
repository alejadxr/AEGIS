id: sigma_evasion_binary_padding
name: Binary Padding Evasion
kind: sigma
severity: medium
enabled: false
tactics:
- DefenseEvasion
techniques:
- T1027.001
data_sources:
- edr
condition:
  event_type: file_modification
  filter:
    size_change_gt: 1048576
    path_contains:
    - .exe
    - .dll
    - .bin
entityMappings:
- type: IP
  field: source_ip
description: |
  DISABLED (NEEDS AGENT CHANGE): filters on `size_change`, a byte-size delta.
  The Python agent file monitor reports the path and before/after hashes only,
  node-tauri file events carry the path only, and host_monitor reports the
  path only. To revive it, add the size before/after to file events, map it in
  edr_events, then set `enabled: true`.

  Executable modified with padding to evade hash-based detection.
