id: sigma_evasion_binary_padding
name: Binary Padding Evasion
kind: sigma
severity: medium
enabled: false
tactics:
- DefenseEvasion
techniques:
- T1027.001
data_sources:
- edr
condition:
  event_type: file_modification
  filter:
    size_change_gt: 1048576
    path_contains:
    - .exe
    - .dll
    - .bin
entityMappings:
- type: IP
  field: source_ip
description: |
  DISABLED (unfeedable in this deployment): this rule is filed under a reachable
  event type (`file_modification`) but filters on `size_change`, which
  host_monitor never populates (it reports the path only), so its filter can
  never match. To revive it, add host_monitor to publish the byte-size delta
  with file events, then set `enabled: true`.

  Executable modified with padding to evade hash-based detection.
