id: sigma_evasion_indicator_removal
name: Indicator Removal on Host
kind: sigma
severity: high
enabled: true
tactics:
- DefenseEvasion
techniques:
- T1070
data_sources:
- edr
condition:
  event_type: process_creation
  filter:
    cmdline_regex: (?i)(\bshred\s|\bsrm\s|\bsdelete(64)?(\.exe)?\s|\bcipher(\.exe)?\s+/w:?|\bwipe\s+-)
entityMappings:
- type: IP
  field: source_ip
description: Removal of forensic artifacts from the host system.
