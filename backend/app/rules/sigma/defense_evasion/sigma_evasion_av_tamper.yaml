id: sigma_evasion_av_tamper
name: Antivirus/EDR Tampering
kind: sigma
severity: critical
enabled: true
tactics:
- DefenseEvasion
techniques:
- T1562.001
data_sources:
- edr
condition:
  event_type: process_creation
  filter:
    cmdline_regex: (?i)(\bsc(\.exe)?\s+(stop|delete|config)\s+(windefend|wdnissvc|sense|mssense|wscsvc)|\bnet1?\s+stop\s+"?(windefend|security center|wdnissvc)|\bset-mppreference\b.*-disable\w+\s+\$?(true|1)|\badd-mppreference\b.*-exclusion\w+|\btaskkill\b.*/im\s+(msmpeng|nissrv|msseces|mssense)\S*)
entityMappings:
- type: IP
  field: source_ip
description: Attempt to disable or tamper with security tools.
