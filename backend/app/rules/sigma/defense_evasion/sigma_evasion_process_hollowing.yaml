id: sigma_evasion_process_hollowing
name: Process Hollowing Detected
kind: sigma
severity: critical
enabled: false
tactics:
- DefenseEvasion
techniques:
- T1055.012
data_sources:
- edr
condition:
  event_type: process_injection
  filter:
    technique: hollowing
entityMappings:
- type: IP
  field: source_ip
description: |
  DISABLED (unfeedable in this deployment): no AEGIS producer emits
  `process_injection` events (host_monitor only reports process start and file
  changes). This rule sits on event type `process_injection`, so it can never
  receive an event and would only inflate the advertised rule count. To revive
  it, add an EDR sensor with memory/API-level visibility publishing
  `process_injection` events, then set `enabled: true`.

  Legitimate process unmapped and replaced with malicious code.
