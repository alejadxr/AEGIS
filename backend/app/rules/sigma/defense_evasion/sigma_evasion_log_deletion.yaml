id: sigma_evasion_log_deletion
name: Security Log Deletion
kind: sigma
severity: critical
enabled: true
tactics:
- DefenseEvasion
techniques:
- T1070.001
data_sources:
- edr
condition:
  event_type: process_creation
  filter:
    cmdline_regex: (?i)(\bwevtutil(\.exe)?\s+(cl|clear-log)\b|\bclear-eventlog\b|\brm\s+(-\S+\s+)*/var/log/\S|\btruncate\s+(-\S+\s+\S+\s+)*/var/log/\S)
entityMappings:
- type: IP
  field: source_ip
description: System or security log files deleted or cleared.
