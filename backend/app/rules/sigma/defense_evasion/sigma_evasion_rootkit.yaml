id: sigma_evasion_rootkit
name: Rootkit Behavior Detected
kind: sigma
severity: critical
enabled: false
tactics:
- DefenseEvasion
techniques:
- T1014
data_sources:
- edr
condition:
  event_type: kernel_module_load
  filter:
    signed: false
entityMappings:
- type: IP
  field: source_ip
description: |
  DISABLED (unfeedable in this deployment): no AEGIS producer emits
  `kernel_module_load` events. This rule sits on event type
  `kernel_module_load`, so it can never receive an event and would only inflate
  the advertised rule count. To revive it, add a kernel/auditd feed publishing
  `kernel_module_load` events, then set `enabled: true`.

  Kernel module loading or syscall hooking detected.
