id: sigma_exfil_uncommon_port
name: HTTPS on Uncommon Port
kind: sigma
severity: medium
enabled: false
tactics:
- Exfiltration
techniques:
- T1571
data_sources:
- network
condition:
  event_type: connection
  count_threshold: 5
  time_window_seconds: 300
  group_by: source_ip
  filter:
    protocol: tls
    target_type: external
entityMappings:
- type: IP
  field: source_ip
description: |
  DISABLED (NEEDS AGENT CHANGE): needs `protocol: tls` and `target_type` on a
  `connection` event, grouped by source; endpoint `network_connection` events
  carry the remote peer and port only. To revive it, retarget to
  `network_connection` grouped by hostname with a port allow-list and count
  distinct uncommon ports per host, then set `enabled: true`.

  TLS traffic on non-standard port suggesting covert channel.
