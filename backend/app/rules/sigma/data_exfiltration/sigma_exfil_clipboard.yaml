id: sigma_exfil_clipboard
name: Clipboard Data Access
kind: sigma
severity: medium
enabled: false
tactics:
- Exfiltration
techniques:
- T1115
data_sources:
- edr
condition:
  event_type: clipboard_access
  count_threshold: 10
  time_window_seconds: 60
  group_by: process_name
entityMappings:
- type: IP
  field: source_ip
description: |
  DISABLED (unfeedable in this deployment): no AEGIS producer emits
  `clipboard_access` events. This rule sits on event type `clipboard_access`, so
  it can never receive an event and would only inflate the advertised rule
  count. To revive it, add an endpoint agent reporting clipboard access, then
  set `enabled: true`.

  Process accessing clipboard data for potential exfiltration.
