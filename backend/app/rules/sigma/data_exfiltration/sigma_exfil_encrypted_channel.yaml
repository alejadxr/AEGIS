id: sigma_exfil_encrypted_channel
name: Encrypted Channel Data Exfiltration
kind: sigma
severity: high
enabled: false
tactics:
- Exfiltration
techniques:
- T1041
data_sources:
- network
condition:
  event_type: connection
  filter:
    protocol: tls
    direction: outbound
    bytes_gt: 10485760
entityMappings:
- type: IP
  field: source_ip
description: |
  DISABLED (NEEDS AGENT CHANGE): needs `bytes` per connection and a `protocol:
  tls` classification. Endpoint agents report the connection open event only
  (no byte counters). To revive it, add per-connection byte counts to the
  agent (ETW TcpIp send/recv sizes or netstat deltas), map them in edr_events,
  then set `enabled: true`.

  High-volume encrypted traffic to unusual destination.
