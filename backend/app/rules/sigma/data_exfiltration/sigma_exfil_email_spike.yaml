id: sigma_exfil_email_spike
name: Email Attachment Spike
kind: sigma
severity: medium
enabled: false
tactics:
- Exfiltration
techniques:
- T1048.002
data_sources:
- email
condition:
  event_type: email_sent
  count_threshold: 20
  time_window_seconds: 300
  group_by: sender
  filter:
    has_attachment: true
entityMappings:
- type: IP
  field: source_ip
description: |
  DISABLED (unfeedable in this deployment): no AEGIS producer emits `email_sent`
  events. This rule sits on event type `email_sent`, so it can never receive an
  event and would only inflate the advertised rule count. To revive it, add a
  mail-gateway log feed, then set `enabled: true`.

  Unusual volume of email with attachments from single user.
