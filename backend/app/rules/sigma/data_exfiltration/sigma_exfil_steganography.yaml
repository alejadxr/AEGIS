id: sigma_exfil_steganography
name: Steganography Tool Detected
kind: sigma
severity: high
enabled: true
tactics:
- DefenseEvasion
techniques:
- T1027.003
data_sources:
- edr
condition:
  event_type: process_creation
  filter:
    cmdline_regex: (?i)(\b(steghide|openstego|outguess)(\.exe)?\b|\bsnow(\.exe)?\s+-[a-z])
entityMappings:
- type: IP
  field: source_ip
description: Known steganography tool execution detected.
