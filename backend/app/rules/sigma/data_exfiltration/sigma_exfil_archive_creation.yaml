id: sigma_exfil_archive_creation
name: Archive Created Before Transfer
kind: sigma
severity: high
enabled: true
tactics:
- Exfiltration
techniques:
- T1560.001
data_sources:
- edr
condition:
  event_type: process_creation
  count_threshold: 2
  time_window_seconds: 120
  group_by: source_ip
  filter:
    cmdline_regex: (?i)(\btar\s+(-?[a-z]*c[a-z]*|--create)\b|\b(7z|7za|rar)(\.exe)?\s+a\s|\bzip(\.exe)?\s+(-\S+\s+)*\S+|\bcompress-archive\b)
entityMappings:
- type: IP
  field: source_ip
description: Archive file created shortly before outbound network activity.
