id: sigma_exfil_usb
name: USB Storage Device Mounted
kind: sigma
severity: medium
enabled: false
tactics:
- Exfiltration
techniques:
- T1052.001
data_sources:
- endpoint
condition:
  event_type: device_connect
  filter:
    device_type: usb_storage
entityMappings:
- type: IP
  field: source_ip
description: |
  DISABLED (unfeedable in this deployment): no AEGIS producer emits
  `device_connect` events. This rule sits on event type `device_connect`, so it
  can never receive an event and would only inflate the advertised rule count.
  To revive it, add an endpoint agent reporting removable-device attach events,
  then set `enabled: true`.

  USB mass storage device connected and mounted.
