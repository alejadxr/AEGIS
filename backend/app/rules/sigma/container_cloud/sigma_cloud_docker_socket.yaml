id: sigma_cloud_docker_socket
name: Docker Socket Exposed
kind: sigma
severity: critical
enabled: false
tactics:
- PrivilegeEscalation
techniques:
- T1611
data_sources:
- container
condition:
  event_type: container_start
  filter:
    path_contains:
    - /var/run/docker.sock
entityMappings:
- type: IP
  field: source_ip
description: |
  DISABLED (unfeedable in this deployment): no AEGIS producer emits
  `container_start` events (no container runtime telemetry exists). This rule
  sits on event type `container_start`, so it can never receive an event and
  would only inflate the advertised rule count. To revive it, add a
  Docker/containerd event feed publishing `container_start` events, then set
  `enabled: true`.

  Docker socket mounted inside container allowing host access.
