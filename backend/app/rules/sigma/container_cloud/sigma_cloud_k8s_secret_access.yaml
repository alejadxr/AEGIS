id: sigma_cloud_k8s_secret_access
name: Kubernetes Secret Accessed
kind: sigma
severity: high
enabled: false
tactics:
- CredentialAccess
techniques:
- T1552.007
data_sources:
- cloud
condition:
  event_type: cloud_api
  count_threshold: 3
  time_window_seconds: 60
  group_by: source_ip
  filter:
    path_contains:
    - /api/v1/secrets
    - get secrets
entityMappings:
- type: IP
  field: source_ip
description: |
  DISABLED (unfeedable in this deployment): no AEGIS producer emits `cloud_api`
  events (no cloud audit-log ingestion exists). This rule sits on event type
  `cloud_api`, so it can never receive an event and would only inflate the
  advertised rule count. To revive it, add a cloud audit-log ingester
  (CloudTrail, GCP Audit, Kubernetes audit) publishing `cloud_api` events, then
  set `enabled: true`.

  Kubernetes secrets accessed from unexpected pod or user.
