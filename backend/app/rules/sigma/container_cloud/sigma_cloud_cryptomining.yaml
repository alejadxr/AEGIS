id: sigma_cloud_cryptomining
name: Cryptomining in Container
kind: sigma
severity: high
enabled: true
tactics:
- Impact
techniques:
- T1496
data_sources:
- edr
condition:
  event_type: process_creation
  filter:
    cmdline_regex: (?i)(\b(xmrig|minerd|cpuminer)\b|stratum\+(tcp|ssl)://|\bcryptonight\b)
entityMappings:
- type: IP
  field: source_ip
description: Cryptocurrency mining process detected inside container.
