id: sigma_cloud_container_escape
name: Container Escape Attempt
kind: sigma
severity: critical
enabled: true
tactics:
- PrivilegeEscalation
techniques:
- T1611
data_sources:
- edr
condition:
  event_type: process_creation
  filter:
    cmdline_regex: (?i)(\bnsenter\b.*(-t|--target)[ =]*1\b|/proc/1/root|\bchroot\s+/(host|mnt|proc))
entityMappings:
- type: IP
  field: source_ip
description: Process attempting to escape container sandbox.
