id: sigma_cloud_iam_enum
name: Cloud IAM Enumeration
kind: sigma
severity: high
enabled: false
tactics:
- Discovery
techniques:
- T1087.004
data_sources:
- cloud
condition:
  event_type: cloud_api
  count_threshold: 5
  time_window_seconds: 120
  group_by: source_ip
  filter:
    path_contains:
    - ListUsers
    - ListRoles
    - ListPolicies
    - GetAccountAuthorizationDetails
entityMappings:
- type: IP
  field: source_ip
description: |
  DISABLED (unfeedable in this deployment): no AEGIS producer emits `cloud_api`
  events (no cloud audit-log ingestion exists). This rule sits on event type
  `cloud_api`, so it can never receive an event and would only inflate the
  advertised rule count. To revive it, add a cloud audit-log ingester
  (CloudTrail, GCP Audit, Kubernetes audit) publishing `cloud_api` events, then
  set `enabled: true`.

  Enumeration of IAM users, roles, or policies.
