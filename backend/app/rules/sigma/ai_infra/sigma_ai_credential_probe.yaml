id: sigma_ai_credential_probe
name: AI / LLM Credential Harvesting Probe
kind: sigma
severity: high
enabled: true
tactics:
- Reconnaissance
- CredentialAccess
techniques:
- T1552.001
- T1595.003
data_sources:
- pm2
- web_log
condition:
  event_type: web_request
  count_threshold: 1
  time_window_seconds: 300
  group_by: source_ip
  filter:
    path_contains:
    - /.claude/
    - /.cursor/
    - /.windsurf/
    - /.continue/
    - /.codex/
    - /.gemini/
    - /.aider
    - /.mcp.json
    - /mcp.json
    - /.vscode/sftp.json
    - /.vscode/settings.json
    - litellm.yaml
    - litellm_config
    - /.env.anthropic
    - /.env.openai
    - /.openai/
    - /.anthropic/
    - /.config/gh/
entityMappings:
- type: IP
  field: source_ip
description: >
  A web client requested a configuration path that only exists to hold AI or LLM
  tooling credentials: the config directories of coding assistants (Claude Code,
  Cursor, Windsurf, Continue, Codex, Gemini, Aider), MCP server definitions,
  editor SFTP/settings files, LiteLLM proxy configs, provider-specific .env
  files and GitHub CLI tokens. Scanners now sweep for these alongside the
  classic .env/.git paths because a leaked key is directly resellable compute.
  Single-shot is deliberate: no legitimate internet client has a reason to
  request any of these from a production web server, so one hit is already the
  campaign and waiting for a threshold would only let the sweep finish. Covered
  by no other rule: sigma_web_sensitive_file_probe lists the classic secret
  paths and needs three hits.
references:
- https://isc.sans.edu/diary/33150
- https://cybersecuritynews.com/internet-wide-scans-target-mcp-servers-claude-credentials/
- https://labs.zenity.io/post/admin-api-escalation-litellm
- https://owasp.org/www-project-top-10-for-large-language-model-applications/
- https://attack.mitre.org/techniques/T1552/001/
