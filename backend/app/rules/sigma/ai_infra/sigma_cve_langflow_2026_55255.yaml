id: sigma_cve_langflow_2026_55255
name: Langflow Exploitation Attempt (CVE-2026-55255)
kind: sigma
severity: critical
enabled: true
tactics:
- InitialAccess
techniques:
- T1190
data_sources:
- http_logs
condition:
  event_type: http_request
  filter:
    path_contains:
    - /api/v1/responses
entityMappings:
- type: IP
  field: source_ip
description: Detects attempted exploitation of CVE-2026-55255 in Langflow (CVSS 9.9). Signature
  rule. These path fragments are distinctive to exploitation of this CVE and do not occur
  in ordinary traffic, so a single hit is evidence in itself and the rule fires without a
  threshold.
references:
- https://github.com/langflow-ai/langflow/security/advisories/GHSA-qrpv-q767-xqq2
