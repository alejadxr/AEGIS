id: sigma_cve_mlflow_2026_64849
name: MLflow Exploitation Attempt (CVE-2026-64849)
kind: sigma
severity: high
enabled: true
tactics:
- InitialAccess
techniques:
- T1190
data_sources:
- http_logs
condition:
  event_type: http_request
  filter:
    path_contains:
    - /api/2.0/mlflow/webhooks
  count_threshold: 10
  time_window_seconds: 300
  group_by: source_ip
entityMappings:
- type: IP
  field: source_ip
description: 'Detects attempted exploitation of CVE-2026-64849 in MLflow (CVSS 8.5). Behavioural
  rule. The exploit payload for this CVE is not visible in the URL -- it travels in the request
  body or a header, which this platform cannot read -- so the rule measures rhythm instead
  of signature: ten or more requests to this endpoint from one source in five minutes is consistent
  with automated payload iteration, not with a real user.'
references:
- https://github.com/advisories/GHSA-7gwp-5pfp-969j
