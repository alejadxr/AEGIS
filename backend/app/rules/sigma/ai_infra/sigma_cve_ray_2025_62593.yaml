id: sigma_cve_ray_2025_62593
name: Ray Exploitation Attempt (CVE-2025-62593)
kind: sigma
severity: critical
enabled: true
tactics:
- InitialAccess
techniques:
- T1190
data_sources:
- http_logs
condition:
  event_type: http_request
  filter:
    path_contains:
    - /api/job_agent/jobs
    - /api/jobs
  count_threshold: 10
  time_window_seconds: 300
  group_by: source_ip
entityMappings:
- type: IP
  field: source_ip
description: 'Detects attempted exploitation of CVE-2025-62593 in Ray (CVSS 9.8). Behavioural
  rule. The exploit payload for this CVE is not visible in the URL -- it travels in the request
  body or a header, which this platform cannot read -- so the rule measures rhythm instead
  of signature: ten or more requests to this endpoint from one source in five minutes is consistent
  with automated payload iteration, not with a real user.'
references:
- https://github.com/advisories/GHSA-q279-jhrf-cc6v
