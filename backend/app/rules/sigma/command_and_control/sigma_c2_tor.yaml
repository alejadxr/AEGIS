id: sigma_c2_tor
name: Tor Network Usage Detected
kind: sigma
severity: high
enabled: true
tactics:
- CommandAndControl
techniques:
- T1090.003
data_sources:
- network
condition:
  event_type: network_connection
  group_by: hostname
  filter:
    destination_port:
    - 9001
    - 9030
    - 9050
    - 9051
entityMappings:
- type: IP
  field: source_ip
description: |
  Endpoint rule. Fed by outbound connections from an AEGIS agent: tcp_connect
  events (node-tauri ETW sensor, non-default build feature) and new outbound
  connections to public addresses from the Python agent. source_ip is the
  remote peer, never the endpoint; peers that are internal or safelisted are
  dropped before evaluation. Matching on the Tor port alone is a heuristic, so
  the incident is a lead, not proof.

  Connection to known Tor entry/exit nodes.
