id: dns_tunneling
name: Possible DNS Tunneling
kind: sigma
severity: high
enabled: false
tactics:
- CommandAndControl
techniques:
- T1071.004
data_sources:
- dns
condition:
  event_type: dns_query
  count_threshold: 100
  time_window_seconds: 60
  group_by: source_ip
entityMappings:
- type: IP
  field: source_ip
description: |
  DISABLED (unfeedable in this deployment): no AEGIS producer emits `dns_query`
  events (dns_monitor only tails Linux resolver logs that do not exist on the
  macOS host, and emits nothing). This rule sits on event type `dns_query`, so
  it can never receive an event and would only inflate the advertised rule
  count. To revive it, add a DNS query log feed (e.g. Pi-hole/dnsmasq/Unbound
  logs) normalised into `dns_query` events, then set `enabled: true`.
  Endpoint side: node-tauri defines a dns_query event kind but no sensor emits
  it (its ETW session subscribes to no DNS provider) and edr_events does not
  map it. To revive it, add a DNS-Client ETW subscription to the agent and map
  dns_query in edr_events.

  Unusually high volume of DNS queries from a single host.
