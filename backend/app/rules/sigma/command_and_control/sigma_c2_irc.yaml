id: sigma_c2_irc
name: IRC C2 Traffic Detected
kind: sigma
severity: high
enabled: true
tactics:
- CommandAndControl
techniques:
- T1071.001
data_sources:
- network
condition:
  event_type: network_connection
  group_by: hostname
  filter:
    destination_port:
    - 6667
    - 6668
    - 6669
    - 6697
entityMappings:
- type: IP
  field: source_ip
description: |
  Endpoint rule. Fed by outbound connections from an AEGIS agent: tcp_connect
  events (node-tauri ETW sensor, non-default build feature) and new outbound
  connections to public addresses from the Python agent. source_ip is the
  remote peer, never the endpoint; peers that are internal or safelisted are
  dropped before evaluation. Matching on the IRC port alone is a heuristic, so
  the incident is a lead, not proof.

  IRC protocol traffic detected suggesting botnet C2 channel.
