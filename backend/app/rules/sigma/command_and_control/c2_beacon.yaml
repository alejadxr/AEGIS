id: c2_beacon
name: C2 Beacon Pattern Detected
kind: sigma
severity: critical
enabled: false
tactics:
- CommandAndControl
techniques:
- T1071
data_sources:
- network
condition:
  event_type: connection
  count_threshold: 5
  time_window_seconds: 300
  group_by: source_ip
  unique_field: destination_ip
  filter:
    direction: outbound
    target_type: external
entityMappings:
- type: IP
  field: source_ip
description: |
  DISABLED (NEEDS AGENT CHANGE): the rule sits on event type `connection` and
  counts distinct destination_ip per source_ip. Endpoint agents deliver
  outbound connections as `network_connection` with source_ip = destination_ip
  = the remote peer, so a per-source count of distinct destinations is always
  1. To revive it, retarget the rule to `network_connection` grouped by
  hostname and counting distinct peers/ports per host, then set `enabled:
  true`.

  Periodic outbound connections suggesting command-and-control beaconing.
