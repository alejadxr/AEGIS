id: sigma_c2_dns
name: DNS-Based Command and Control
kind: sigma
severity: critical
enabled: false
tactics:
- CommandAndControl
techniques:
- T1071.004
data_sources:
- dns
condition:
  event_type: dns_query
  count_threshold: 200
  time_window_seconds: 300
  group_by: source_ip
entityMappings:
- type: IP
  field: source_ip
description: |
  DISABLED (unfeedable in this deployment): no AEGIS producer emits `dns_query`
  events (dns_monitor only tails Linux resolver logs that do not exist on the
  macOS host, and emits nothing). This rule sits on event type `dns_query`, so
  it can never receive an event and would only inflate the advertised rule
  count. To revive it, add a DNS query log feed (e.g. Pi-hole/dnsmasq/Unbound
  logs) normalised into `dns_query` events, then set `enabled: true`.

  Suspicious DNS query patterns indicating C2 via DNS protocol.
