id: sigma_auth_ssh_key_brute
name: SSH Key Brute Force
kind: sigma
severity: high
enabled: false
tactics:
- CredentialAccess
techniques:
- T1110.004
data_sources:
- auth_log
condition:
  event_type: auth_failure
  count_threshold: 20
  time_window_seconds: 120
  group_by: source_ip
  filter:
    service: ssh
    auth_method: publickey
entityMappings:
- type: IP
  field: source_ip
description: |
  DISABLED (unfeedable in this deployment): this rule is filed under a reachable
  event type (`auth_failure`) but filters on  and , which no producer populates
  (the log normalizer emits protocol, not service or auth method), so its filter
  can never match. To revive it, add the normalizer to extract the auth service
  and method onto auth_failure events, then set `enabled: true`.

  Multiple SSH key authentication failures from same IP.
