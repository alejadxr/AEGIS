id: sigma_auth_mfa_bypass
name: MFA Bypass Attempt
kind: sigma
severity: critical
enabled: false
tactics:
- CredentialAccess
techniques:
- T1556.006
data_sources:
- auth_log
condition:
  event_type: mfa_failure
  count_threshold: 5
  time_window_seconds: 300
  group_by: username
entityMappings:
- type: IP
  field: source_ip
description: |
  DISABLED (unfeedable in this deployment): no AEGIS producer emits
  `mfa_failure` events. This rule sits on event type `mfa_failure`, so it can
  never receive an event and would only inflate the advertised rule count. To
  revive it, add an identity-provider log feed, then set `enabled: true`.

  Successful auth without MFA after multiple MFA failures.
