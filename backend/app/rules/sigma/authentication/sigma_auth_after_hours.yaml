id: sigma_auth_after_hours
name: After-Hours Authentication
kind: sigma
severity: medium
enabled: false
tactics:
- DefenseEvasion
techniques:
- T1078
data_sources:
- auth_log
condition:
  event_type: auth_success
  filter:
    time_of_day: off_hours
entityMappings:
- type: IP
  field: source_ip
description: |
  DISABLED (unfeedable in this deployment): no AEGIS producer emits
  `auth_success` events (the log normalizer only classifies failures). This rule
  sits on event type `auth_success`, so it can never receive an event and would
  only inflate the advertised rule count. To revive it, add a normalizer pattern
  for successful logins that also extracts user, geo and time context, then set
  `enabled: true`.

  Successful authentication outside normal business hours.
