id: sigma_auth_ftp_brute
name: FTP Brute Force Detected
kind: sigma
severity: high
enabled: false
tactics:
- CredentialAccess
techniques:
- T1110.001
data_sources:
- auth_log
condition:
  event_type: auth_failure
  count_threshold: 10
  time_window_seconds: 300
  group_by: source_ip
  filter:
    service: ftp
entityMappings:
- type: IP
  field: source_ip
description: |
  DISABLED (unfeedable in this deployment): this rule is filed under a reachable
  event type (`auth_failure`) but filters on `service`, which no producer
  populates (the log normalizer emits protocol, not service), so its filter can
  never match. To revive it, add the normalizer to extract the auth service
  (ftp/smtp/vpn/ssh) onto auth_failure events, then set `enabled: true`.

  Multiple failed FTP login attempts from same source.
