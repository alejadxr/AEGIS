id: sigma_auth_impossible_travel
name: Impossible Travel - Concurrent Sessions
kind: sigma
severity: high
enabled: false
tactics:
- DefenseEvasion
techniques:
- T1078
data_sources:
- auth_log
condition:
  event_type: auth_success
  count_threshold: 3
  time_window_seconds: 900
  group_by: username
  unique_field: geo_country
  cooldown_seconds: 1800
entityMappings:
- type: IP
  field: source_ip
description: |
  DISABLED (unfeedable in this deployment): no AEGIS producer emits
  `auth_success` events (the log normalizer only classifies failures). This rule
  sits on event type `auth_success`, so it can never receive an event and would
  only inflate the advertised rule count. To revive it, add a normalizer pattern
  for successful logins that also extracts user, geo and time context, then set
  `enabled: true`.

  Same user authenticated from geographically distant locations simultaneously.
