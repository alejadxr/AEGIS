id: ransomware_extension_mass_change
name: Mass file extension change suggestive of encryption
description: |
  DISABLED (NEEDS AGENT CHANGE): needs `file_extension_change` events (old and
  new extension, per process). No agent emits renames: the Python monitor
  forwards `moved` without the destination path, and node-tauri's
  mass_extension_change exists only as a signal inside a forensic incident
  that is posted after two signals already correlated on the endpoint. To
  revive it, have the agent emit a rename event with the new path and pid, map
  it in edr_events, then set `enabled: true`.

  Detects a single process renaming more than 50 files to ransomware-associated
  extensions within 60 seconds. This is the strongest behavioural signal of an
  active encryption phase — legitimate bulk-rename tools rarely reach this
  threshold and virtually never target .locked / .crypt / .wcry suffixes.
kind: sigma
severity: critical
enabled: false
tactics:
- Impact
techniques:
- T1486
data_sources:
- fim
- edr
condition:
  event_type: file_extension_change
  count_threshold: 50
  time_window_seconds: 60
  group_by: process_pid
  filter:
    new_extension_regex: '\.(locked|crypt|encrypted|enc|aes|rsa|pwnd|wcry|wncry|cryptolocker|locky|petya)$'
customDetails: {}
entityMappings:
- type: Host
  field: hostname
references:
- https://attack.mitre.org/techniques/T1486/
