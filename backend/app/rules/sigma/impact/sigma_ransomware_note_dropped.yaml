id: ransomware_note_dropped
name: Ransom note file artifact created
description: |
  Detects creation of a file whose name matches common ransom-note patterns
  (README_FOR_DECRYPT.txt, HOW_TO_RESTORE, decrypt_instructions, etc.).
  Ransomware families consistently drop a note after completing encryption;
  this rule provides a high-confidence post-encryption trip with zero false
  positives in normal workloads.
kind: sigma
severity: high
enabled: true
tactics:
- Impact
techniques:
- T1486
data_sources:
- fim
condition:
  event_type: file_creation
  count_threshold: 1
  time_window_seconds: 60
  group_by: hostname
  filter:
    # Matched with re.search against the full path (see correlation_engine
    # file_name alias), so every alternative is anchored to the BASENAME. A
    # bare `readme.*\.txt` matched every ordinary README.txt.
    file_name_regex: '(?i)(?:^|[\\/])(?:[^\\/]*read[_ -]?me[_ -]?(?:for[_ -]?|to[_ -]?)?(?:decrypt|restore|recover|unlock)[^\\/]*\.(?:txt|hta|html?)|!{2,}[^\\/]*read[_ -]?me[^\\/]*|[^\\/]*(?:how[_ -]?to[_ -]?(?:decrypt|restore|recover)|decrypt[_-]?instructions?|recover[_-]?files?|-files-have-been)[^\\/]*)$'
customDetails: {}
entityMappings:
- type: Host
  field: hostname
references:
- https://attack.mitre.org/techniques/T1486/
