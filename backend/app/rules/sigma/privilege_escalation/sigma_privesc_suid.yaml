id: sigma_privesc_suid
name: SUID Binary Exploitation
kind: sigma
severity: critical
enabled: false
tactics:
- PrivilegeEscalation
techniques:
- T1548.001
data_sources:
- edr
condition:
  event_type: process_creation
  filter:
    suid: true
    path_contains:
    - find
    - vim
    - nmap
    - python
    - perl
entityMappings:
- type: IP
  field: source_ip
description: |
  DISABLED (unfeedable in this deployment): this rule is filed under a reachable
  event type (`process_creation`) but filters on `suid`, which host_monitor
  never populates, so its filter can never match. To revive it, add host_monitor
  to publish the setuid bit of the executable, then set `enabled: true`.

  Execution of uncommon SUID binary suggesting privilege escalation.
