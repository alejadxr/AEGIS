id: sigma_privesc_named_pipe
name: Named Pipe Impersonation
kind: sigma
severity: high
enabled: false
tactics:
- PrivilegeEscalation
techniques:
- T1134.001
data_sources:
- edr
condition:
  event_type: pipe_creation
  filter:
    path_contains:
    - \\.\pipe\
    - ImpersonateNamedPipeClient
entityMappings:
- type: IP
  field: source_ip
description: |
  DISABLED (unfeedable in this deployment): no AEGIS producer emits
  `pipe_creation` events (Windows-only telemetry). This rule sits on event type
  `pipe_creation`, so it can never receive an event and would only inflate the
  advertised rule count. To revive it, add a Windows EDR sensor publishing
  `pipe_creation` events, then set `enabled: true`.

  Named pipe created for token impersonation.
