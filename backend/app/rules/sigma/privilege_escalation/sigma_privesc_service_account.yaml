id: sigma_privesc_service_account
name: Service Account Privilege Abuse
kind: sigma
severity: high
enabled: false
tactics:
- DefenseEvasion
techniques:
- T1078.003
data_sources:
- edr
condition:
  event_type: process_creation
  filter:
    account_type: service
    path_contains:
    - cmd.exe
    - powershell
    - /bin/bash
entityMappings:
- type: IP
  field: source_ip
description: |
  DISABLED (unfeedable in this deployment): this rule is filed under a reachable
  event type (`process_creation`) but filters on `account_type`, which
  host_monitor never populates, so its filter can never match. To revive it, add
  host_monitor to publish the owning account type, then set `enabled: true`.

  Service account performing actions beyond normal scope.
