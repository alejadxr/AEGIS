id: sigma_privesc_service_account
name: Service Account Privilege Abuse
kind: sigma
severity: high
enabled: false
tactics:
- DefenseEvasion
techniques:
- T1078.003
data_sources:
- edr
condition:
  event_type: process_creation
  filter:
    account_type: service
    path_contains:
    - cmd.exe
    - powershell
    - /bin/bash
entityMappings:
- type: IP
  field: source_ip
description: |
  DISABLED (NEEDS AGENT CHANGE): filters on `account_type`. Agents send the
  account NAME (`username`), not its class, and 'service account' is not
  derivable from a name across Windows, macOS and Linux. To revive it, have
  the agent report the account type (SID class / uid range) with
  process_start, retarget its command-token clause to cmdline_regex, then set
  `enabled: true`.

  Service account performing actions beyond normal scope.
