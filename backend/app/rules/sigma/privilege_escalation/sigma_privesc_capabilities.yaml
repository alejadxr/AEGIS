id: sigma_privesc_capabilities
name: Linux Capability Abuse
kind: sigma
severity: high
enabled: true
tactics:
- PrivilegeEscalation
techniques:
- T1548
data_sources:
- edr
condition:
  event_type: process_creation
  filter:
    cmdline_regex: (?i)\bsetcap\b.*\bcap_(setuid|setgid|sys_admin|sys_ptrace|dac_override)
entityMappings:
- type: IP
  field: source_ip
description: Binary with dangerous capabilities executed for privilege escalation.
