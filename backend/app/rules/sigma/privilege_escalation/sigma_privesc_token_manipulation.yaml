id: sigma_privesc_token_manipulation
name: Access Token Manipulation
kind: sigma
severity: critical
enabled: false
tactics:
- PrivilegeEscalation
techniques:
- T1134
data_sources:
- edr
condition:
  event_type: token_manipulation
  count_threshold: 1
  time_window_seconds: 60
  group_by: source_ip
entityMappings:
- type: IP
  field: source_ip
description: |
  DISABLED (unfeedable in this deployment): no AEGIS producer emits
  `token_manipulation` events (Windows-only telemetry). This rule sits on event
  type `token_manipulation`, so it can never receive an event and would only
  inflate the advertised rule count. To revive it, add a Windows EDR sensor
  publishing `token_manipulation` events, then set `enabled: true`.

  Token impersonation or theft for privilege escalation.
