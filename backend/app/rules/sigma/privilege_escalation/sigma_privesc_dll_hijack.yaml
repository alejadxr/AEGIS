id: sigma_privesc_dll_hijack
name: DLL Hijacking Attempt
kind: sigma
severity: high
enabled: false
tactics:
- PrivilegeEscalation
techniques:
- T1574.001
data_sources:
- edr
condition:
  event_type: dll_load
  filter:
    path_contains:
    - \Temp\
    - \Downloads\
    - \AppData\
entityMappings:
- type: IP
  field: source_ip
description: |
  DISABLED (unfeedable in this deployment): no AEGIS producer emits `dll_load`
  events (Windows-only telemetry; the EDR runs on macOS). This rule sits on
  event type `dll_load`, so it can never receive an event and would only inflate
  the advertised rule count. To revive it, add a Windows EDR sensor publishing
  `dll_load` events, then set `enabled: true`.

  DLL loaded from unexpected path suggesting DLL hijacking.
