id: sigma_lateral_port_forward
name: Port Forwarding Detected
kind: sigma
severity: medium
enabled: false
tactics:
- LateralMovement
techniques:
- T1572
data_sources:
- network
condition:
  event_type: network
  filter:
    port_forward: true
entityMappings:
- type: IP
  field: source_ip
description: |
  DISABLED (unfeedable in this deployment): no AEGIS producer emits `network`
  events (no flow or byte-count telemetry exists in this deployment). This rule
  sits on event type `network`, so it can never receive an event and would only
  inflate the advertised rule count. To revive it, add a flow-volume telemetry
  source (e.g. NetFlow/pcap on the Pi gateway) publishing `network` events with
  byte counts, then set `enabled: true`.

  Local or remote port forwarding established.
