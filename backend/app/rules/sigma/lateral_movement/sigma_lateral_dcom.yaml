id: sigma_lateral_dcom
name: DCOM Remote Execution
kind: sigma
severity: high
enabled: false
tactics:
- LateralMovement
techniques:
- T1021.003
data_sources:
- edr
condition:
  event_type: process_creation
  filter:
    parent_process: mmc.exe
    path_contains:
    - excel.exe
    - powershell.exe
entityMappings:
- type: IP
  field: source_ip
description: |
  DISABLED (NEEDS AGENT CHANGE): filters on the PARENT process (parent_process
  = mmc.exe; its command-token clause also needs retargeting from
  path_contains to cmdline_regex). Endpoint agents send `ppid` only, never the
  parent's name or path, and the backend does not resolve it before
  evaluation. To revive it, have the agent send parent_name/parent_path with
  process_start (or resolve ppid against the stored process tree in
  edr_events), then set `enabled: true`.

  Process creation via DCOM lateral movement technique.
