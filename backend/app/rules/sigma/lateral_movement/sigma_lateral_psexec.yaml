id: sigma_lateral_psexec
name: PsExec Remote Execution
kind: sigma
severity: high
enabled: true
tactics:
- LateralMovement
techniques:
- T1569.002
data_sources:
- edr
condition:
  event_type: service_install
  filter:
    service_name:
    - PSEXESVC
    - psexec
entityMappings:
- type: IP
  field: source_ip
description: |
  Endpoint rule. Fed by Security event 4697 (new service installed) reported
  by the node-tauri agent through /nodes/events on Windows; other service-
  install sources (System 7045) are not collected.

  PsExec service installation or usage detected on remote host.
