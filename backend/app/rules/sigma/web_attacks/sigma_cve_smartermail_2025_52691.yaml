id: sigma_cve_smartermail_2025_52691
name: SmarterMail Exploitation Attempt (CVE-2025-52691)
kind: sigma
severity: critical
enabled: true
tactics:
- InitialAccess
techniques:
- T1190
data_sources:
- http_logs
condition:
  event_type: http_request
  filter:
    path_contains_all:
    - /api/upload
    - guid=../
entityMappings:
- type: IP
  field: source_ip
description: Detects attempted exploitation of CVE-2025-52691 in SmarterMail (CVSS 9.3, linked
  to ransomware campaigns). Signature rule. These path fragments are distinctive to exploitation
  of this CVE and do not occur in ordinary traffic, so a single hit is evidence in itself
  and the rule fires without a threshold.
references:
- https://www.sentinelone.com/vulnerability-database/cve-2025-52691/
