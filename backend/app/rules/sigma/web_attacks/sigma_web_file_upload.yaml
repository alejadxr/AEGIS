id: sigma_web_file_upload
name: Malicious File Upload Attempt
kind: sigma
severity: high
enabled: true
tactics:
- Persistence
techniques:
- T1505.003
data_sources:
- pm2
- web_log
condition:
  event_type: web_request
  count_threshold: 1
  time_window_seconds: 300
  group_by: source_ip
  filter:
    method: POST
    path_contains:
    - .php
    - .jsp
    - .aspx
    - .sh
    - .exe
    - .phtml
    path_excludes:
    - xmlrpc.php
entityMappings:
- type: IP
  field: source_ip
description: >
  POST to a path with an executable or script extension (.php, .jsp, .aspx, .sh,
  .exe, .phtml). This is a request-shape signature: no upload body or response
  is inspected. `xmlrpc.php` is excluded because POSTs to it are the WordPress
  XML-RPC botnet (brute force / pingback), not a file upload, and were being
  titled "Malicious File Upload Attempt"; they are reported by
  sigma_web_php_probe as what they are.
