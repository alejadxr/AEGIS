id: sigma_cve_fortinet_fortisandbox_2026_25089
name: Fortinet FortiSandbox Exploitation Attempt (CVE-2026-25089)
kind: sigma
severity: critical
enabled: true
tactics:
- InitialAccess
techniques:
- T1190
data_sources:
- http_logs
condition:
  event_type: http_request
  filter:
    path_contains:
    - /fortisandbox/job-detail/tracer-behavior
entityMappings:
- type: IP
  field: source_ip
description: Detects attempted exploitation of CVE-2026-25089 in Fortinet FortiSandbox (CVSS
  9.1). Signature rule. These path fragments are distinctive to exploitation of this CVE and
  do not occur in ordinary traffic, so a single hit is evidence in itself and the rule fires
  without a threshold.
references:
- https://fortiguard.fortinet.com/psirt/FG-IR-26-141
