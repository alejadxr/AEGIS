id: sigma_cve_quest_kace_sma_2025_32975
name: Quest KACE SMA Exploitation Attempt (CVE-2025-32975)
kind: sigma
severity: critical
enabled: true
tactics:
- InitialAccess
techniques:
- T1190
data_sources:
- http_logs
condition:
  event_type: http_request
  filter:
    path_contains:
    - /adminui/
  count_threshold: 10
  time_window_seconds: 300
  group_by: source_ip
entityMappings:
- type: IP
  field: source_ip
description: 'Detects attempted exploitation of CVE-2025-32975 in Quest KACE SMA (CVSS 9.8).
  Behavioural rule. The exploit payload for this CVE is not visible in the URL -- it travels
  in the request body or a header, which this platform cannot read -- so the rule measures
  rhythm instead of signature: ten or more requests to this endpoint from one source in five
  minutes is consistent with automated payload iteration, not with a real user.'
references:
- https://support.quest.com/kb/4379499
