id: sigma_cve_smartermail_2026_23760
name: SmarterMail Exploitation Attempt (CVE-2026-23760)
kind: sigma
severity: critical
enabled: true
tactics:
- InitialAccess
techniques:
- T1190
data_sources:
- http_logs
condition:
  event_type: http_request
  filter:
    path_contains:
    - /api/v1/auth/force-reset-password
    - /api/force-reset-password
entityMappings:
- type: IP
  field: source_ip
description: Detects attempted exploitation of CVE-2026-23760 in SmarterMail (CVSS 9.8, linked
  to ransomware campaigns). Signature rule. These path fragments are distinctive to exploitation
  of this CVE and do not occur in ordinary traffic, so a single hit is evidence in itself
  and the rule fires without a threshold.
references:
- https://www.smartertools.com/smartermail/release-notes/current
