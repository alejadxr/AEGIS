id: sigma_web_secret_harvest_instant
name: Secret File Request (Single Probe)
kind: sigma
severity: low
enabled: true
tactics:
- Reconnaissance
- CredentialAccess
techniques:
- T1595.003
- T1552.001
data_sources:
- pm2
- web_log
condition:
  event_type: web_request
  count_threshold: 1
  time_window_seconds: 300
  group_by: source_ip
  filter:
    path_contains:
    - /.env
    - /.aws/
    - /.git/config
    - /.ssh/
    - /.npmrc
entityMappings:
- type: IP
  field: source_ip
description: >
  A single request for a secret or credential file (.env, .aws, .git/config,
  .ssh, .npmrc). sigma_web_sensitive_file_probe needs three hits in five
  minutes, so a scanner that sent only one or two probes left no trace at all
  (observed: a scanner requested /.env twice plus config.json and a PHPUnit POST
  against one app and produced no incident). Severity is deliberately low: the
  request alone proves intent but not success, and the same source is folded
  into one incident by the per-attacker burst merge, so a sweep is one row, not
  one per path. Low keeps this a visibility rule that must not auto-block a
  source on its own; a sustained sweep still escalates through the three-hit
  rule.
