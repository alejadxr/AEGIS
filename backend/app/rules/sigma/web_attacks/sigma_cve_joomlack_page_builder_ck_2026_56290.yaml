id: sigma_cve_joomlack_page_builder_ck_2026_56290
name: Joomlack Page Builder CK Exploitation Attempt (CVE-2026-56290)
kind: sigma
severity: critical
enabled: true
tactics:
- InitialAccess
techniques:
- T1190
data_sources:
- http_logs
condition:
  event_type: http_request
  filter:
    path_contains:
    - option=com_pagebuilderck
    - view=upload
entityMappings:
- type: IP
  field: source_ip
description: Detects attempted exploitation of CVE-2026-56290 in Joomlack Page Builder CK
  (CVSS 10.0). Signature rule. These path fragments are distinctive to exploitation of this
  CVE and do not occur in ordinary traffic, so a single hit is evidence in itself and the
  rule fires without a threshold.
references:
- https://www.sentinelone.com/vulnerability-database/cve-2026-56290/
