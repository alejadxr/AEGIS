id: sigma_cve_oracle_peoplesoft_peopletool_2026_35273
name: Oracle PeopleSoft PeopleTools Exploitation Attempt (CVE-2026-35273)
kind: sigma
severity: critical
enabled: true
tactics:
- InitialAccess
techniques:
- T1190
data_sources:
- http_logs
condition:
  event_type: http_request
  filter:
    path_contains:
    - /psemhub/hub
entityMappings:
- type: IP
  field: source_ip
description: Detects attempted exploitation of CVE-2026-35273 in Oracle PeopleSoft PeopleTools
  (CVSS 9.8, linked to ransomware campaigns). Signature rule. These path fragments are distinctive
  to exploitation of this CVE and do not occur in ordinary traffic, so a single hit is evidence
  in itself and the rule fires without a threshold.
references:
- https://www.tenable.com/cve/CVE-2026-35273
