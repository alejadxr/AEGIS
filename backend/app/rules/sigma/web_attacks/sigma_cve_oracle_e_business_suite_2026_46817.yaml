id: sigma_cve_oracle_e_business_suite_2026_46817
name: Oracle E-Business Suite Exploitation Attempt (CVE-2026-46817)
kind: sigma
severity: critical
enabled: true
tactics:
- InitialAccess
techniques:
- T1190
data_sources:
- http_logs
condition:
  event_type: http_request
  filter:
    path_contains:
    - /oa_html/ibytransmit
    - /ibytransmit
entityMappings:
- type: IP
  field: source_ip
description: Detects attempted exploitation of CVE-2026-46817 in Oracle E-Business Suite (CVSS
  9.8). Signature rule. These path fragments are distinctive to exploitation of this CVE and
  do not occur in ordinary traffic, so a single hit is evidence in itself and the rule fires
  without a threshold.
references:
- https://thehackernews.com/2026/06/oracle-e-business-suite-flaw-cve-2026.html
