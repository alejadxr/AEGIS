id: sigma_cve_joomshaper_sp_page_builder_2026_48908
name: JoomShaper SP Page Builder Exploitation Attempt (CVE-2026-48908)
kind: sigma
severity: critical
enabled: true
tactics:
- InitialAccess
techniques:
- T1190
data_sources:
- http_logs
condition:
  event_type: http_request
  filter:
    path_contains:
    - option=com_sppagebuilder
    - method=uploadcustomicon
entityMappings:
- type: IP
  field: source_ip
description: Detects attempted exploitation of CVE-2026-48908 in JoomShaper SP Page Builder
  (CVSS 10.0). Signature rule. These path fragments are distinctive to exploitation of this
  CVE and do not occur in ordinary traffic, so a single hit is evidence in itself and the
  rule fires without a threshold.
references:
- https://www.sentinelone.com/vulnerability-database/cve-2026-48908/
