id: sigma_cve_microsoft_configuration_mana_2024_43468
name: Microsoft Configuration Manager Exploitation Attempt (CVE-2024-43468)
kind: sigma
severity: critical
enabled: true
tactics:
- InitialAccess
techniques:
- T1190
data_sources:
- http_logs
condition:
  event_type: http_request
  filter:
    path_contains:
    - /mp_location
  count_threshold: 10
  time_window_seconds: 300
  group_by: source_ip
entityMappings:
- type: IP
  field: source_ip
description: 'Detects attempted exploitation of CVE-2024-43468 in Microsoft Configuration
  Manager (CVSS 9.8). Behavioural rule. The exploit payload for this CVE is not visible in
  the URL -- it travels in the request body or a header, which this platform cannot read --
  so the rule measures rhythm instead of signature: ten or more requests to this endpoint
  from one source in five minutes is consistent with automated payload iteration, not with
  a real user.'
references:
- https://www.sentinelone.com/vulnerability-database/cve-2024-43468/
