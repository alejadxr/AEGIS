id: sigma_cve_versa_concerto_2025_34026
name: Versa Concerto Exploitation Attempt (CVE-2025-34026)
kind: sigma
severity: critical
enabled: true
tactics:
- InitialAccess
techniques:
- T1190
data_sources:
- http_logs
condition:
  event_type: http_request
  filter:
    path_contains:
    - /actuator
entityMappings:
- type: IP
  field: source_ip
description: Detects attempted exploitation of CVE-2025-34026 in Versa Concerto (CVSS 9.2).
  Signature rule. These path fragments are distinctive to exploitation of this CVE and do
  not occur in ordinary traffic, so a single hit is evidence in itself and the rule fires
  without a threshold.
references:
- https://www.sentinelone.com/vulnerability-database/cve-2025-34026/
