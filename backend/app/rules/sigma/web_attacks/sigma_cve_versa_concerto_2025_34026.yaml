id: sigma_cve_versa_concerto_2025_34026
name: Versa Concerto Exploitation Attempt (CVE-2025-34026)
kind: sigma
severity: critical
enabled: true
tactics:
- InitialAccess
techniques:
- T1190
data_sources:
- http_logs
condition:
  event_type: http_request
  filter:
    path_contains:
    - /actuator/env
    - /actuator/heapdump
    - /actuator/threaddump
    - /actuator/configprops
    - /actuator/mappings
entityMappings:
- type: IP
  field: source_ip
description: >
  Detects attempted exploitation of CVE-2025-34026 in Versa Concerto (CVSS 9.2),
  an authentication bypass that exposes Spring Boot Actuator endpoints. Only the
  endpoints that actually disclose data are matched (env, heapdump, threaddump,
  configprops, mappings). The earlier bare `/actuator` substring also fired on
  `/actuator/health` and on plain `/actuator` discovery, which are routine
  health probes and scanner recon, not exploitation; a bare `/actuator` is now
  counted as low-severity recon by sigma_web_framework_probe instead. Signature rule: a
  single hit on these paths is evidence in itself, so it fires without a
  threshold.
references:
- https://www.sentinelone.com/vulnerability-database/cve-2025-34026/
