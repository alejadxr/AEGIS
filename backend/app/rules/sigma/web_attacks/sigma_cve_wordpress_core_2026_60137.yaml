id: sigma_cve_wordpress_core_2026_60137
name: WordPress Core Exploitation Attempt (CVE-2026-60137)
kind: sigma
severity: critical
enabled: true
tactics:
- InitialAccess
techniques:
- T1190
data_sources:
- http_logs
condition:
  event_type: http_request
  filter:
    path_contains_all:
    - /wp-json/batch/v1
    - author__not_in=
entityMappings:
- type: IP
  field: source_ip
description: Detects attempted exploitation of CVE-2026-60137 in WordPress Core (CVSS 9.8).
  Signature rule. These path fragments are distinctive to exploitation of this CVE and do
  not occur in ordinary traffic, so a single hit is evidence in itself and the rule fires
  without a threshold.
references:
- https://wordpress.org/news/2026/07/wordpress-7-0-2-release/
