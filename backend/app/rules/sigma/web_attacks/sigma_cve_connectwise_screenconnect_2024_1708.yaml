id: sigma_cve_connectwise_screenconnect_2024_1708
name: ConnectWise ScreenConnect Exploitation Attempt (CVE-2024-1708)
kind: sigma
severity: critical
enabled: true
tactics:
- InitialAccess
techniques:
- T1190
data_sources:
- http_logs
condition:
  event_type: http_request
  filter:
    path_contains:
    - /services/
    - /connector/
  count_threshold: 10
  time_window_seconds: 300
  group_by: source_ip
entityMappings:
- type: IP
  field: source_ip
description: 'Detects attempted exploitation of CVE-2024-1708 in ConnectWise ScreenConnect
  (CVSS 9.9, linked to ransomware campaigns). Behavioural rule. The exploit payload for this
  CVE is not visible in the URL -- it travels in the request body or a header, which this
  platform cannot read -- so the rule measures rhythm instead of signature: ten or more requests
  to this endpoint from one source in five minutes is consistent with automated payload iteration,
  not with a real user.'
references:
- https://www.connectwise.com/company/trust/security-bulletins/connectwise-screenconnect-23.9.8
