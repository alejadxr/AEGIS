id: sigma_cve_craft_cms_2025_32432
name: Craft CMS Exploitation Attempt (CVE-2025-32432)
kind: sigma
severity: critical
enabled: true
tactics:
- InitialAccess
techniques:
- T1190
data_sources:
- http_logs
condition:
  event_type: http_request
  filter:
    path_contains:
    - actions/assets/generate-transform
  count_threshold: 10
  time_window_seconds: 300
  group_by: source_ip
entityMappings:
- type: IP
  field: source_ip
description: 'Detects attempted exploitation of CVE-2025-32432 in Craft CMS (CVSS 10.0). Behavioural
  rule. The exploit payload for this CVE is not visible in the URL -- it travels in the request
  body or a header, which this platform cannot read -- so the rule measures rhythm instead
  of signature: ten or more requests to this endpoint from one source in five minutes is consistent
  with automated payload iteration, not with a real user.'
references:
- https://craftcms.com/knowledge-base/craft-cms-cve-2025-32432
