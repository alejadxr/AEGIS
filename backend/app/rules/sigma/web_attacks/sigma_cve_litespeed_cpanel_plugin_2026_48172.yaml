id: sigma_cve_litespeed_cpanel_plugin_2026_48172
name: LiteSpeed cPanel Plugin Exploitation Attempt (CVE-2026-48172)
kind: sigma
severity: critical
enabled: true
tactics:
- InitialAccess
techniques:
- T1190
data_sources:
- http_logs
condition:
  event_type: http_request
  filter:
    path_contains:
    - /litespeed/
  count_threshold: 10
  time_window_seconds: 300
  group_by: source_ip
entityMappings:
- type: IP
  field: source_ip
description: 'Detects attempted exploitation of CVE-2026-48172 in LiteSpeed cPanel Plugin
  (CVSS 9.8). Behavioural rule. The exploit payload for this CVE is not visible in the URL
  -- it travels in the request body or a header, which this platform cannot read -- so the
  rule measures rhythm instead of signature: ten or more requests to this endpoint from one
  source in five minutes is consistent with automated payload iteration, not with a real user.'
references:
- https://blog.litespeedtech.com/2026/05/21/security-update
