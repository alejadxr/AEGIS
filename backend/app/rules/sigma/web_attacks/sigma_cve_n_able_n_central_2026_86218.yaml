id: sigma_cve_n_able_n_central_2026_86218
name: N-able N-central Exploitation Attempt (CVE-2026-86218)
kind: sigma
severity: critical
enabled: true
tactics:
- InitialAccess
techniques:
- T1190
data_sources:
- http_logs
condition:
  event_type: http_request
  filter:
    path_contains:
    - /dms2/
    - /discovery/
  count_threshold: 10
  time_window_seconds: 300
  group_by: source_ip
entityMappings:
- type: IP
  field: source_ip
description: 'Detects attempted exploitation of CVE-2026-86218 in N-able N-central (CVSS 10.0).
  Behavioural rule. The exploit payload for this CVE is not visible in the URL -- it travels
  in the request body or a header, which this platform cannot read -- so the rule measures
  rhythm instead of signature: ten or more requests to this endpoint from one source in five
  minutes is consistent with automated payload iteration, not with a real user.'
references:
- https://arcticwolf.com/resources/blog/cve-2026-86218/
