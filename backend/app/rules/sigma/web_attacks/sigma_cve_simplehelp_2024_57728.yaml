id: sigma_cve_simplehelp_2024_57728
name: SimpleHelp Exploitation Attempt (CVE-2024-57728)
kind: sigma
severity: critical
enabled: true
tactics:
- InitialAccess
techniques:
- T1190
data_sources:
- http_logs
condition:
  event_type: http_request
  filter:
    path_contains:
    - /toolbox-plugin/
  count_threshold: 10
  time_window_seconds: 300
  group_by: source_ip
entityMappings:
- type: IP
  field: source_ip
description: 'Detects attempted exploitation of CVE-2024-57728 in SimpleHelp (CVSS 8.9, linked
  to ransomware campaigns). Behavioural rule. The exploit payload for this CVE is not visible
  in the URL -- it travels in the request body or a header, which this platform cannot read
  -- so the rule measures rhythm instead of signature: ten or more requests to this endpoint
  from one source in five minutes is consistent with automated payload iteration, not with
  a real user.'
references:
- https://simple-help.com/kb---security-vulnerabilities-01-2025
