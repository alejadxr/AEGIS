id: sigma_cve_cisco_catalyst_sd_wan_2026_20127
name: Cisco Catalyst SD-WAN Exploitation Attempt (CVE-2026-20127)
kind: sigma
severity: critical
enabled: true
tactics:
- InitialAccess
techniques:
- T1190
data_sources:
- http_logs
condition:
  event_type: http_request
  filter:
    path_contains:
    - /restconf
    - /api/configuration/device/list
  count_threshold: 10
  time_window_seconds: 300
  group_by: source_ip
entityMappings:
- type: IP
  field: source_ip
description: 'Detects attempted exploitation of CVE-2026-20127 in Cisco Catalyst SD-WAN (CVSS
  10.0). Behavioural rule. The exploit payload for this CVE is not visible in the URL -- it
  travels in the request body or a header, which this platform cannot read -- so the rule
  measures rhythm instead of signature: ten or more requests to this endpoint from one source
  in five minutes is consistent with automated payload iteration, not with a real user.'
references:
- https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-rpa-EHchtZk
