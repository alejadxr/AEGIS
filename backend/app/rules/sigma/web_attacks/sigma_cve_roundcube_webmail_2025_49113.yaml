id: sigma_cve_roundcube_webmail_2025_49113
name: Roundcube Webmail Exploitation Attempt (CVE-2025-49113)
kind: sigma
severity: critical
enabled: true
tactics:
- InitialAccess
techniques:
- T1190
data_sources:
- http_logs
condition:
  event_type: http_request
  filter:
    path_contains_all:
    - /program/actions/settings/upload.php
    - _from=
entityMappings:
- type: IP
  field: source_ip
description: Detects attempted exploitation of CVE-2025-49113 in Roundcube Webmail (CVSS 9.9).
  Signature rule. These path fragments are distinctive to exploitation of this CVE and do
  not occur in ordinary traffic, so a single hit is evidence in itself and the rule fires
  without a threshold.
references:
- https://fearsoff.org/research/roundcube
