id: sigma_cve_dell_recoverpoint_for_vms_2026_22769
name: Dell RecoverPoint for VMs Exploitation Attempt (CVE-2026-22769)
kind: sigma
severity: high
enabled: true
tactics:
- InitialAccess
techniques:
- T1190
data_sources:
- http_logs
condition:
  event_type: http_request
  filter:
    path_contains:
    - /api/admin
  count_threshold: 10
  time_window_seconds: 300
  group_by: source_ip
entityMappings:
- type: IP
  field: source_ip
description: 'Detects attempted exploitation of CVE-2026-22769 in Dell RecoverPoint for VMs
  (CVSS 8.8). Behavioural rule. The exploit payload for this CVE is not visible in the URL
  -- it travels in the request body or a header, which this platform cannot read -- so the
  rule measures rhythm instead of signature: ten or more requests to this endpoint from one
  source in five minutes is consistent with automated payload iteration, not with a real user.'
references:
- https://www.dell.com/support/kbdoc/en-us/000426773/dsa-2026-079
