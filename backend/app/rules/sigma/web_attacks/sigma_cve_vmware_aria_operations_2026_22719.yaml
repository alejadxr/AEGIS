id: sigma_cve_vmware_aria_operations_2026_22719
name: VMware Aria Operations Exploitation Attempt (CVE-2026-22719)
kind: sigma
severity: high
enabled: true
tactics:
- InitialAccess
techniques:
- T1190
data_sources:
- http_logs
condition:
  event_type: http_request
  filter:
    path_contains:
    - /suite-api/api/v1/migration
  count_threshold: 10
  time_window_seconds: 300
  group_by: source_ip
entityMappings:
- type: IP
  field: source_ip
description: 'Detects attempted exploitation of CVE-2026-22719 in VMware Aria Operations (CVSS
  8.1). Behavioural rule. The exploit payload for this CVE is not visible in the URL -- it
  travels in the request body or a header, which this platform cannot read -- so the rule
  measures rhythm instead of signature: ten or more requests to this endpoint from one source
  in five minutes is consistent with automated payload iteration, not with a real user.'
references:
- https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/36947
