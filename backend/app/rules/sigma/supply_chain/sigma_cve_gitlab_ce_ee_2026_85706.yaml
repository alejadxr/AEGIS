id: sigma_cve_gitlab_ce_ee_2026_85706
name: GitLab CE/EE Exploitation Attempt (CVE-2026-85706)
kind: sigma
severity: critical
enabled: true
tactics:
- InitialAccess
techniques:
- T1190
data_sources:
- http_logs
condition:
  event_type: http_request
  filter:
    path_contains:
    - /repository/commits/
  count_threshold: 10
  time_window_seconds: 300
  group_by: source_ip
entityMappings:
- type: IP
  field: source_ip
description: 'Detects attempted exploitation of CVE-2026-85706 in GitLab CE/EE (CVSS 10.0).
  Behavioural rule. The exploit payload for this CVE is not visible in the URL -- it travels
  in the request body or a header, which this platform cannot read -- so the rule measures
  rhythm instead of signature: ten or more requests to this endpoint from one source in five
  minutes is consistent with automated payload iteration, not with a real user.'
references:
- https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-3-2-released/
