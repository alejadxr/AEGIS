id: sigma_cve_gitea_2026_60004
name: Gitea Exploitation Attempt (CVE-2026-60004)
kind: sigma
severity: critical
enabled: true
tactics:
- InitialAccess
techniques:
- T1190
data_sources:
- http_logs
condition:
  event_type: http_request
  filter:
    path_contains:
    - /diffpatch
entityMappings:
- type: IP
  field: source_ip
description: Detects attempted exploitation of CVE-2026-60004 in Gitea (CVSS 9.1). Signature
  rule. These path fragments are distinctive to exploitation of this CVE and do not occur
  in ordinary traffic, so a single hit is evidence in itself and the rule fires without a
  threshold.
references:
- https://github.com/go-gitea/gitea/security/advisories/GHSA-rcr6-4jqh-j84m
