id: credential_breach_chain
name: Credential attack succeeded and the account is being used
kind: chain
severity: critical
enabled: true
tactics:
- CredentialAccess
- InitialAccess
- Execution
techniques:
- T1110
- T1078
- T1505.003
data_sources:
- correlation
# The one chain here whose middle stage is invisible to AEGIS today. A 200 on a
# credential endpoint is an ordinary log line — it fires no rule and opens no
# incident, so a brute force that SUCCEEDS currently looks exactly like one that
# failed. chain_leg_auth_success (chain_only: true) makes that stage available
# to correlation without making it an alert of its own.
#
#   stage 1  auth_failure / http_auth_failure / ssh_honeypot_failure
#   stage 2  http_request  — POST to a credential path returning 2xx/3xx
#   stage 3  http_request / priv_escalation / web_request / sql_injection
#
# Stage 3 is required on purpose. Real users do forget passwords: "15 failures
# then a success" describes a legitimate login often enough that alerting on it
# would be worse than silence, and this platform blocks autonomously. Demanding
# attacker behaviour AFTER the success is what makes the chain safe to act on.
description: 'Same IP, in order: credential-attack burst -> successful authentication
  on the same surface -> attacker activity from the authenticated session'
condition:
  event_type: __chain__
max_window_seconds: 3600
group_by: source_ip
cooldown_seconds: 1800
chain:
- label: credential attack burst
  # Only rules whose every filter / unique_field reads a field the log pipeline
  # actually emits. Deliberately NOT listed, because each reads a field no
  # producer populates and therefore can never fire:
  #   credential_stuffing, sigma_auth_password_spray  -> unique_field: username
  #   sigma_auth_default_credentials                  -> filter: username
  #   sigma_auth_ssh_key_brute, sigma_auth_vpn_brute  -> filter: service / auth_method
  # Add them here if a producer ever emits an authenticated username.
  any_of:
  - brute_force_ssh
  - http_auth_brute_force
  - generic_credential_attack
  - ssh_honeypot_attempt
  within: 1800
- label: authentication succeeded
  sigma_rule: chain_leg_auth_success
  within: 900
- label: post-authentication activity
  # Payload-signature rules only. web_shell_activity and sigma_web_file_upload
  # are deliberately excluded even though they sound ideal here: both fire on any
  # POST to a path containing `.php`, which is what a WordPress or Joomla admin
  # does on every save (`/wp-admin/admin-ajax.php`). With them in this stage the
  # chain fired on a real administrator who mistyped their password 30 times and
  # then used the dashboard — verified, and exactly the false positive this
  # platform must not have, since it blocks autonomously. Each of those two
  # rules still alerts on its own.
  any_of:
  - privilege_escalation
  - sigma_web_command_injection
  - sigma_web_path_traversal
  - sql_injection_chain
  - sigma_exfil_cloud_upload
  within: 1800
entityMappings:
- type: IP
  field: source_ip
